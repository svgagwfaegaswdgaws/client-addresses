plugins { id 'com.android.application' }
android {
    namespace 'edu.demo.clientaddresses'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'edu.demo.clientaddresses'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        def serverUrl = (project.findProperty('serverUrl') ?: 'https://svgagwfaegaswdgaws.pythonanywhere.com').toString()
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + serverUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
